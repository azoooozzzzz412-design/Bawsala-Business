<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bawsala Business · بوصلة للأعمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --teal-950:#0A2027;
    --teal-900:#0F2C34;
    --teal-800:#163B44;
    --teal-700:#1E4B55;
    --brass:#C89A46;
    --brass-light:#E0BD74;
    --parchment:#F6F3EA;
    --paper:#FFFFFF;
    --ink:#1B2422;
    --ink-soft:#5B6A67;
    --line:#E7E1D2;
    --green:#3C7A5A;
    --green-bg:#E8F1EA;
    --red:#B14B34;
    --red-bg:#F7E9E4;
    --shadow: 0 1px 2px rgba(15,44,52,0.06), 0 8px 24px rgba(15,44,52,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;
    background:var(--parchment);
    color:var(--ink);
    font-feature-settings:"tnum" 1;
  }
  ::selection{background:var(--brass-light); color:var(--teal-950);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  .shell{display:flex; min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:264px; flex:0 0 264px;
    background:linear-gradient(180deg, var(--teal-950), var(--teal-900) 60%, var(--teal-950));
    color:#EAF1EE;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    display:flex; align-items:center; gap:12px;
    padding:22px 20px 18px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand-mark{
    width:38px; height:38px; border-radius:10px;
    background:linear-gradient(155deg, var(--brass-light), var(--brass));
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .brand-name{font-size:16px; font-weight:700; letter-spacing:0.2px;}
  .brand-sub{font-size:11.5px; color:#9FB3AE; margin-top:1px;}

  .nav{flex:1; padding:14px 12px; overflow-y:auto;}
  .nav-label{font-size:11px; color:#7E9791; padding:6px 12px 8px; letter-spacing:0.3px;}
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 14px; border-radius:10px;
    color:#CBDAD5; font-size:14px; font-weight:500;
    margin-bottom:2px; transition:background .15s ease, color .15s ease;
    border:1px solid transparent;
  }
  .nav-item svg{flex:0 0 auto; opacity:0.85;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{
    background:rgba(200,154,70,0.16);
    border-color:rgba(200,154,70,0.35);
    color:#F2E2BE;
  }
  .nav-item.active svg{opacity:1;}

  .sidebar-foot{
    padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; gap:10px;
  }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(155deg,#4F7B72,#2C5049);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; color:#EAF1EE; flex:0 0 auto;
  }
  .user-name{font-size:13px; font-weight:600; color:#EAF1EE;}
  .user-mail{font-size:11px; color:#8FA6A0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px;}
  .logout{margin-inline-start:auto; color:#8FA6A0; opacity:0.8;}
  .logout:hover{opacity:1; color:#fff;}

  /* ---------- MAIN ---------- */
  .main{flex:1; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 30px 8px; flex-wrap:wrap; gap:12px;
  }
  .topbar-group{display:flex; align-items:center; gap:14px;}
  .today{font-size:13px; color:var(--ink-soft);}
  .today b{display:block; font-size:14px; color:var(--ink); font-weight:600; margin-top:2px;}
  .page-title{font-size:20px; font-weight:700;}
  .hamburger{display:none; background:none; border:none; padding:8px;}

  .lang-switch{display:flex; align-items:center; gap:2px; background:#EFEAE0; padding:3px; border-radius:20px;}
  .lang-btn{padding:7px 15px; border-radius:16px; font-size:12.5px; font-weight:600; color:var(--ink-soft); border:none; background:transparent;}
  .lang-btn.active{background:var(--teal-950); color:#fff;}

  .content{padding:6px 30px 40px;}

  .hero{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    margin:10px 0 22px; flex-wrap:wrap;
  }
  .hero h1{font-size:27px; margin:6px 0 6px; font-weight:700;}
  .hero p{margin:0; color:var(--ink-soft); font-size:14px; max-width:520px; line-height:1.7;}
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; color:var(--green); background:var(--green-bg);
    padding:5px 12px; border-radius:20px; font-weight:600;
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:10px; font-size:13.5px; font-weight:600;
    border:1px solid transparent;
  }
  .btn-dark{background:var(--teal-950); color:#fff;}
  .btn-dark:hover{background:var(--teal-800);}
  .btn-brass{background:var(--brass); color:#2A2010;}
  .btn-brass:hover{background:var(--brass-light);}
  .btn-outline{background:var(--paper); color:var(--ink); border-color:var(--line);}
  .btn-outline:hover{border-color:var(--brass);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--line); padding:8px 12px; font-size:12.5px;}
  .btn-danger-ghost{background:transparent; color:var(--red); border:1px solid var(--red-bg); padding:6px 10px; font-size:12px; border-radius:8px;}
  .btn-danger-ghost:hover{background:var(--red-bg);}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}

  .stat-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;
  }
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow);
  }
  .stat-card{padding:20px; display:flex; flex-direction:column; gap:14px;}
  .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-icon{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  }
  .stat-tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .tag-live{background:var(--green-bg); color:var(--green);}
  .tag-auto{background:#EFF2EE; color:#5C6B67;}
  .stat-label{font-size:13px; color:var(--ink-soft);}
  .stat-value{font-size:26px; font-weight:700; margin-top:2px;}

  .section-card{background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:22px; margin-bottom:20px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:10px;}
  .section-title{font-size:16px; font-weight:700;}
  .section-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .quick-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:16px;}
  .quick-item{
    display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--line);
    border-radius:12px; background:#FCFBF7; transition:border-color .15s ease, background .15s ease;
  }
  .quick-item:hover{border-color:var(--brass); background:#FDF8ED;}
  .quick-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .quick-title{font-size:13.5px; font-weight:600;}
  .quick-sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}

  .grid-2{display:grid; grid-template-columns:1fr 1.6fr; gap:20px; align-items:stretch;}
  .margin-card{display:flex; flex-direction:column; justify-content:space-between; height:100%;}
  .margin-num{font-size:40px; font-weight:700; margin:6px 0;}
  .progress-track{height:8px; border-radius:10px; background:#EFEAE0; overflow:hidden; margin-top:14px;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--brass), var(--green)); border-radius:10px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:start; color:var(--ink-soft); font-weight:600; font-size:12px;
    padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td{padding:12px 12px; border-bottom:1px solid #F0ECE1; white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF9F3;}
  .badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;}
  .badge-ok{background:var(--green-bg); color:var(--green);}
  .badge-low{background:var(--red-bg); color:var(--red);}
  .badge-income{background:var(--green-bg); color:var(--green);}
  .badge-expense{background:var(--red-bg); color:var(--red);}
  .badge-pending{background:#FCF1DC; color:#B58326;}
  .row-actions{display:flex; gap:6px;}
  .empty-row td{text-align:center; color:var(--ink-soft); padding:34px 10px;}
  .table-wrap{overflow-x:auto;}

  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .search-box{display:flex; align-items:center; gap:8px; background:#FCFBF7; border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-width:220px;}
  .search-box svg{color:var(--ink-soft); flex:0 0 auto;}
  .search-box input{border:none; background:none; outline:none; font-family:inherit; font-size:13px; flex:1; color:var(--ink); min-width:0;}
  .chip{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);}
  .chip.active{background:var(--teal-950); color:#fff; border-color:var(--teal-950);}

  .chart-wrap{padding-top:6px;}
  .legend{display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%;}

  .overlay{
    position:fixed; inset:0; background:rgba(10,32,39,0.45); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper); border-radius:18px; width:100%; max-width:480px;
    max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px 12px;}
  .modal-title{font-size:16px; font-weight:700;}
  .modal-close{background:#F1EEE4; border:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .modal-body{padding:6px 22px 22px; display:flex; flex-direction:column; gap:14px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:13.5px; background:#FCFBF7; color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brass); background:#fff;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-foot{display:flex; gap:10px; justify-content:flex-end; margin-top:6px;}
  .line-items{border:1px solid var(--line); border-radius:12px; padding:12px; background:#FCFBF7; display:flex; flex-direction:column; gap:10px;}
  .line-item-row{display:grid; grid-template-columns:1.6fr 0.7fr 0.5fr; gap:8px; align-items:center;}
  .line-total{font-size:13px; color:var(--ink-soft); text-align:end;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--teal-950); color:#fff; padding:12px 20px; border-radius:12px; font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:all .25s ease; z-index:80;
    display:flex; align-items:center; gap:10px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}

  .emp-link{cursor:pointer;}
  .emp-link:hover{text-decoration:underline; color:var(--brass);}
  .clickable-row{cursor:pointer;}

  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .info-box{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .info-label{font-size:11.5px; color:var(--ink-soft); margin-bottom:4px;}
  .info-value{font-size:13.5px; font-weight:700;}
  .info-box svg{color:var(--ink-soft); flex:0 0 auto; margin-top:2px;}

  .tabbar{display:flex; gap:8px; background:#F2EFE6; padding:4px; border-radius:12px; flex-wrap:wrap;}
  .tabchip{flex:1; min-width:100px; text-align:center; padding:9px 10px; border-radius:9px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .tabchip.active{background:#fff; color:var(--ink); box-shadow:var(--shadow);}

  .record-list{max-height:420px; overflow-y:auto;}
  .record-row{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#FCFBF7;}
  .record-title{font-weight:600; font-size:13.5px;}
  .record-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .record-list-title{font-weight:700; font-size:14px; margin-bottom:12px;}
  .banner{padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600; margin-bottom:12px;}
  .banner-amber{background:#FCF1DC; color:#B58326;}
  .banner-green{background:var(--green-bg); color:var(--green);}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:linear-gradient(165deg, var(--teal-950), var(--teal-800));}
  .login-card{background:var(--paper); border-radius:20px; width:100%; max-width:380px; padding:32px 28px; box-shadow:0 30px 80px rgba(0,0,0,0.35);}
  .login-brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .login-error{background:var(--red-bg); color:var(--red); padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; display:none;}
  .login-error.show{display:block;}
  .login-hint{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:16px; line-height:1.7;}
  .spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px; gap:10px;}
  .spinner-dark{width:18px; height:18px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--teal-950); animation:spin .7s linear infinite; display:inline-block;}

  /* ---------- ACCOUNTS / PERMISSIONS ---------- */
  .account-row{border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; background:#FCFBF7;}
  .account-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .account-email{font-weight:700; font-size:13.5px;}
  .perm-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px;}
  .perm-item{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff;}
  .perm-item-title{font-size:12.5px; font-weight:600; margin-bottom:8px;}
  .perm-toggles{display:flex; gap:10px; flex-wrap:wrap;}
  .perm-toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .role-select{padding:6px 10px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:12.5px; background:#fff;}

  @media (max-width: 1080px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .quick-grid{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }
  @media (max-width: 900px){
    .sidebar{position:fixed; inset-inline-start:-264px; top:0; z-index:60; transition:inset-inline-start .2s ease; box-shadow:0 0 40px rgba(0,0,0,0.3);}
    .sidebar.open{inset-inline-start:0;}
    .hamburger{display:flex;}
    .content{padding:6px 16px 40px;}
    .topbar{padding:16px 16px 4px;}
    .btn-sm, .btn-ghost, .btn-danger-ghost{min-height:38px;}
    .lang-btn{padding:9px 14px;}
  }
  @media (max-width: 600px){
    .stat-grid, .quick-grid{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .line-item-row{grid-template-columns:1fr; gap:6px;}
    .line-item-row button{justify-self:end;}
    .modal-foot{flex-wrap:wrap;}
    .modal-foot .btn{flex:1; justify-content:center;}
  }
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:55;}
  .sidebar-scrim.show{display:block;}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen"><span class="spinner-dark"></span><span>...جاري التحميل</span></div>

<div id="loginScreen" class="login-wrap" style="display:none;">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#1B2422"/></svg></div>
      <div>
        <div style="font-weight:700; font-size:16px;" id="loginBrandName">بوصلة للأعمال</div>
        <div style="font-size:11.5px; color:var(--ink-soft);" id="loginBrandSub">تسجيل الدخول</div>
      </div>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="field" style="margin-bottom:14px;"><label id="loginEmailLabel">البريد الإلكتروني</label><input id="loginEmail" type="email" placeholder="name@company.com"></div>
    <div class="field" style="margin-bottom:18px;"><label id="loginPasswordLabel">كلمة المرور</label><input id="loginPassword" type="password" placeholder="••••••••"></div>
    <button class="btn btn-dark" id="loginBtn" style="width:100%; justify-content:center;" onclick="handleLogin()">تسجيل الدخول</button>
    <div class="login-hint" id="loginHint">الحسابات تُنشأ من قِبل الإدارة فقط.</div>
  </div>
</div>

<div class="shell" id="appShell" style="display:none;">
  <div class="sidebar-scrim" id="scrim" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#1B2422"/></svg>
      </div>
      <div>
        <div class="brand-name" id="brandName"></div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">
      <div class="avatar" id="avatarLetter"></div>
      <div>
        <div class="user-name" id="userName"></div>
        <div class="user-mail" id="userMail"></div>
      </div>
      <a class="logout" id="logoutBtn" title="" onclick="handleLogout()" style="cursor:pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 17l5-5-5-5M20 12H9M12 3H6a2 2 0 00-2 2v14a2 2 0 002 2h6"/></svg>
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-group">
        <button class="hamburger" onclick="toggleSidebar(true)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2422" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="today" id="todayBlock"></div>
      </div>
      <div class="topbar-group">
        <div class="page-title" id="pageTitle"></div>
        <div class="lang-switch">
          <button class="lang-btn" id="langAr" onclick="setLang('ar')">عربي</button>
          <button class="lang-btn" id="langEn" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

/* ============================ DATA MAPPERS (DB row <-> app shape) ============================ */
function mapEmployeeRow(row){
  return {
    id: row.id,
    name: row.name || '',
    role: row.role || '',
    department: row.department || '',
    salary: Number(row.salary)||0,
    allowances: Number(row.allowances)||0,
    annualLeaveDays: row.annual_leave_days!=null ? row.annual_leave_days : 30,
    phone: row.phone || '',
    email: row.email || '',
    start: row.start_date,
    status: row.status || 'active',
    nationality: row.nationality || '',
    birthDate: row.birth_date,
    nationalId: row.national_id,
    employeeNumber: row.employee_number,
    authUserId: row.auth_user_id,
    leaves: (row.leaves||[]).map(l=>({id:l.id, from:l.from_date, to:l.to_date, days:l.days, note:l.note||'', status:l.status||'pending', createdAt:l.created_at})),
    absences: (row.absences||[]).map(a=>({id:a.id, date:a.date, note:a.note||''})),
    delays: (row.delays||[]).map(d=>({id:d.id, date:d.date, minutes:d.minutes, note:d.note||''})),
    deductions: (row.deductions||[]).map(d=>({id:d.id, date:d.date, amount:Number(d.amount), note:d.note||''})),
  };
}
function employeeToDbFields(f){
  return {
    name:f.name, role:f.role||null, department:f.department||null, salary:f.salary||0, allowances:f.allowances||0,
    annual_leave_days: f.annualLeaveDays!=null ? f.annualLeaveDays : 30,
    phone:f.phone||null, email:f.email||null, start_date:f.start||null, status:f.status||'active',
    nationality:f.nationality||null, birth_date:f.birthDate||null, national_id:f.nationalId||null,
    employee_number:f.employeeNumber||null,
  };
}
function mapProductRow(row){
  return { id:row.id, name:row.name, sku:row.sku||'', qty:row.qty||0, price:Number(row.price)||0, cost:Number(row.cost)||0 };

function mapOrderRow(row){

    id:row.id, type:row.type, category:row.category||'', amount:Number(row.amount)||0, date:row.date, note:row.note||'',

}

/* ============================ RELOAD (fetch from Supabase) ============================ */
async function reloadEmployees(){
  const { data, error } = await sb.from('employees')
    .select('*, leaves:employee_leaves(*), absences:employee_absences(*), delays:employee_delays(*), deductions:employee_deductions(*)')
    .order('created_at', {ascending:true});
  if(error){ console.error(error); toast(t('errGeneric')); return; }
  state.employees = (data||[]).map(mapEmployeeRow);
}
async function reloadProducts(){
  const { data, error } = await sb.from('products').select('*').order('created_at', {ascending:true});
  if(error){ console.error(error); toast(t('errGeneric')); return; }
  state.products = (data||[]).map(mapProductRow);
}
async function reloadOrders(){
  const { data, error } = await sb.from('orders').select('*, items:order_items(*)').order('created_at', {ascending:true});
  if(error){ console.error(error); toast(t('errGeneric')); return; }
  state.orders = (data||[]).map(mapOrderRow);
}
async function reloadTransactions(){
  const { data, error } = await sb.from('transactions').select('*').order('created_at', {ascending:true});
  if(error){ console.error(error); toast(t('errGeneric')); return; }
  state.transactions = (data||[]).map(mapTxRow);
}
async function reloadAllData(){
  await Promise.all([reloadEmployees(), reloadProducts(), reloadOrders(), reloadTransactions()]);
}
async function reloadMyEmployee(){
  if(!currentUser.employeeId) return null;
  const { data, error } = await sb.from('employees')
    .select('*, leaves:employee_leaves(*), absences:employee_absences(*), delays:employee_delays(*), deductions:employee_deductions(*)')
    .eq('id', currentUser.employeeId)
    .maybeSingle();
  if(error){ console.error(error); return null; }
  if(!data) return null;
  const emp = mapEmployeeRow(data);
  state.employees = [emp];
  return emp;
}

let __realtimeChannel = null;
function setupRealtime(){
  if(__realtimeChannel) return;
  __realtimeChannel = sb.channel('db-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'orders'}, ()=>{ reloadOrders().then(render); })
    .on('postgres_changes', {event:'*', schema:'public', table:'order_items'}, ()=>{ reloadOrders().then(render); })
    .on('postgres_changes', {event:'*', schema:'public', table:'products'}, ()=>{ reloadProducts().then(render); })
    .on('postgres_changes', {event:'*', schema:'public', table:'transactions'}, ()=>{ reloadTransactions().then(render); })
    .on('postgres_changes', {event:'*', schema:'public', table:'employees'}, ()=>{ reloadEmployees().then(render); })
    .on('postgres_changes', {event:'*', schema:'public', table:'employee_leaves'}, ()=>{ reloadEmployees().then(render); })
    .subscribe();
}

function money(n){
  const v = Math.round(n||0).toLocaleString('en-US');
  return state.lang==='ar' ? (v+' '+STR.ar.currency) : (STR.en.currency+' '+v);
}
function pct(n){ return (Math.round(n*10)/10) + '%'; }

function totals(){
  const orderRevenue = state.orders.reduce((s,o)=>s+o.total,0);
  const txIncome = state.transactions.filter(t=>t.type==='income' && t.status==='closed').reduce((s,t)=>s+t.amount,0);
  const txExpense = state.transactions.filter(t=>t.type==='expense' && t.status==='closed').reduce((s,t)=>s+t.amount,0);
  const revenue = orderRevenue + txIncome;
  const cost = txExpense;
  const profit = revenue - cost;
  const margin = revenue>0 ? (profit/revenue*100) : 0;
  return {revenue, cost, profit, margin, orderCount: state.orders.length};
}

function monthlySeries(){
  const out = [];
  for(let m=5;m>=0;m--){
    const d = monthsAgo(m);
    const locale = state.lang==='ar' ? 'ar-SA-u-nu-latn' : 'en-US';
    const label = d.toLocaleDateString(locale,{month:'short'});
    const y = d.getFullYear(), mo = d.getMonth();
    const inMonth = (dateStr)=>{ const dd=new Date(dateStr); return dd.getFullYear()===y && dd.getMonth()===mo; };
    const rev = state.orders.filter(o=>inMonth(o.date)).reduce((s,o)=>s+o.total,0)
              + state.transactions.filter(t=>t.type==='income'&&t.status==='closed'&&inMonth(t.date)).reduce((s,t)=>s+t.amount,0);
    const exp = state.transactions.filter(t=>t.type==='expense'&&t.status==='closed'&&inMonth(t.date)).reduce((s,t)=>s+t.amount,0);
    out.push({label, rev, exp});
  }
  return out;
}

  {key:'inventory', tKey:'nav_inventory', icon:ICONS.inventory},
  {key:'orders', tKey:'nav_orders', icon:ICONS.orders},
  {key:'finance', tKey:'nav_finance', icon:ICONS.finance},
  {key:'staff', tKey:'nav_staff', icon:ICONS.staff},
  {key:'requests', tKey:'nav_requests', icon:ICONS.bell},
  {key:'reports', tKey:'nav_reports', icon:ICONS.reports},
];
function visibleNav(){
  return NAV.filter(n => canView(n.key));
}
function renderNav(){
  const activeKey = state.page==='employeeDetail' ? 'staff' : state.page;
  const el = document.getElementById('navList');
  const items = visibleNav();
  el.innerHTML = '<div class="nav-label">'+t('navLabel')+'</div>' + items.map(n=>`
    <div class="nav-item ${activeKey===n.key?'active':''}" onclick="goTo('${n.key}')">
      ${n.icon}<span>${t(n.tKey)}</span>
    </div>`).join('');
  const emp = state.page==='employeeDetail' ? state.employees.find(e=>e.id===state.selectedEmployeeId) : null;
  const navItem = items.find(n=>n.key===state.page);
  document.getElementById('pageTitle').textContent = emp ? tx(emp.name) : (navItem ? t(navItem.tKey) : '');
}
function goTo(page){
  if(!canView(page)) return;
  state.page = page;
  renderNav();
  toggleSidebar(false);
  render();
}
let employeeDetailTab = 'leaves';
function goToEmployee(id){
  state.page = 'employeeDetail';
  state.selectedEmployeeId = id;
  employeeDetailTab = 'leaves';
  renderNav();
  toggleSidebar(false);
  render();
}
function setEmployeeTab(tab){ employeeDetailTab = tab; render(); }

/* ============================ CHART ============================ */
function chartWidthForViewport(){
  const vw = document.documentElement.clientWidth || window.innerWidth || 760;
  if(vw <= 600) return Math.max(260, vw - 76);
  if(vw <= 900) return Math.max(420, vw - 140);
  if(vw <= 1080) return 560;
  return 760;
}
function financeChartSVG(series, opts={}){
  const w = opts.width||760, h = opts.height||220;
  const padL=44, padR=10, padT=14, padB=26;
  const max = Math.max(1, ...series.map(s=>Math.max(s.rev,s.exp)));
  const niceMax = Math.ceil(max/500)*500 || 500;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const n = series.length;
  const groupW = innerW/n;
  const barW = Math.min(20, groupW*0.28);
  const gap = 6;
  const y = v => padT + innerH - (v/niceMax)*innerH;

  let bars='', labels='', gridLines='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = niceMax/steps*i;
    const yy = y(val);
    gridLines += `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#EBE5D6" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${yy+4}" font-size="10.5" fill="#8B968F" text-anchor="end">${val>=1000?(val/1000)+'k':val}</text>`;
  }
  series.forEach((s,i)=>{
    const cx = padL + groupW*i + groupW/2;
    const xRev = cx - gap/2 - barW;
    const xExp = cx + gap/2;
    const yRev = y(s.rev), yExp = y(s.exp);
    bars += `<rect x="${xRev}" y="${yRev}" width="${barW}" height="${padT+innerH-yRev}" rx="4" fill="#3C7A5A"/>`;
    bars += `<rect x="${xExp}" y="${yExp}" width="${barW}" height="${padT+innerH-yExp}" rx="4" fill="#B14B34"/>`;
    labels += `<text x="${cx}" y="${h-8}" font-size="11" fill="#6B7A75" text-anchor="middle">${s.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}${bars}${labels}
  </svg>`;
}

function leaveDays(from,to){
  if(!from||!to) return 0;
  const d1=new Date(from), d2=new Date(to);
  const diff = Math.round((d2-d1)/86400000)+1;
  return diff>0?diff:0;
}
function reservedLeaveDays(emp){
  return emp.leaves.filter(l=>l.status!=='rejected').reduce((s,l)=>s+l.days,0);
}
function leaveBalanceOf(emp){
  return Math.max(0, (emp.annualLeaveDays!=null?emp.annualLeaveDays:30) - reservedLeaveDays(emp));
}
function leaveStatusBadgeHtml(status){
  const cls = status==='approved' ? 'badge-ok' : status==='rejected' ? 'badge-low' : 'badge-pending';
  const label = status==='approved' ? t('leaveStatusApproved') : status==='rejected' ? t('leaveStatusRejected') : t('leaveStatusPending');
  return `<span class="badge ${cls}">${label}</span>`;
}
function renderLeaveDurationPreview(){
  const d = leaveDays(val('f_leave_from'), val('f_leave_to'));
  const el = document.getElementById('leaveDurationPreview');
  if(el) el.textContent = t('leaveDurationTpl',{n:d});
}
async function removeRecord(empId, arrName, recId){
  const table = {leaves:'employee_leaves', absences:'employee_absences', delays:'employee_delays', deductions:'employee_deductions'}[arrName];
  const { error } = await sb.from(table).delete().eq('id', recId);
  if(error){ toast(t('errGeneric')); return; }
  await reloadEmployees();
  render();
}
async function submitLeave(empId){
  const from=val('f_leave_from'), to=val('f_leave_to'), note=val('f_leave_note');
  const days=leaveDays(from,to);
  if(!from||!to||days<=0){ toast(t('toastNeedDates')); return; }
  const emp = state.employees.find(e=>e.id===empId);
  const available = leaveBalanceOf(emp);
  if(days > available){ toast(t('toastLeaveExceedsBalance',{avail:available})); return; }
  const { error } = await sb.from('employee_leaves').insert({employee_id:empId, from_date:from, to_date:to, days, note, status:'pending'});
  if(error){ toast(t('errGeneric')); return; }
  toast(t('toastLeavePending'));
  if(currentUser.role==='employee'){ await reloadMyEmployee(); } else { await reloadEmployees(); }
  render();
}
async function approveLeave(empId, leaveId){
  const { error } = await sb.from('employee_leaves').update({status:'approved', decided_at:new Date().toISOString()}).eq('id', leaveId);
  if(error){ toast(t('errGeneric')); return; }
  toast(t('toastRequestApproved'));
  await reloadEmployees();
  render();
}
async function rejectLeave(empId, leaveId){
  const { error } = await sb.from('employee_leaves').update({status:'rejected', decided_at:new Date().toISOString()}).eq('id', leaveId);
  if(error){ toast(t('errGeneric')); return; }
  toast(t('toastRequestRejected'));
  await reloadEmployees();
  render();
}
async function submitAbsence(empId){
  const date=val('f_absence_date'), note=val('f_absence_note');
  if(!date){ toast(t('toastNeedDates')); return; }
  const { error } = await sb.from('employee_absences').insert({employee_id:empId, date, note});
  if(error){ toast(t('errGeneric')); return; }
  toast(t('toastAbsenceSubmitted'));
  await reloadEmployees();
  render();
}
async function submitDelay(empId){
  const date=val('f_delay_date'), minutes=numval('f_delay_minutes'), note=val('f_delay_note');
  if(!date){ toast(t('toastNeedDates')); return; }
  if(!minutes || minutes<=0){ toast(t('toastNeedMinutes')); return; }
  const { error } = await sb.from('employee_delays').insert({employee_id:empId, date, minutes, note});
  if(error){ toast(t('errGeneric')); return; }
  toast(t('toastDelaySubmitted'));
  await reloadEmployees();
  render();
}
async function submitDeduction(empId){
  const date=val('f_deduction_date'), amount=numval('f_deduction_amount'), note=val('f_deduction_note');
  if(!date){ toast(t('toastNeedDates')); return; }
  if(!amount || amount<=0){ toast(t('toastNeedDeductionAmount')); return; }
  const { error } = await sb.from('employee_deductions').insert({employee_id:empId, date, amount, note});
  if(error){ toast(t('errGeneric')); return; }
  toast(t('toastDeductionSubmitted'));
  await reloadEmployees();
  render();
}

async function saveEmployee(id){
  const name = val('f_name'), role = val('f_role'), department = val('f_department'), salary = numval('f_salary'), allowances = numval('f_allowances'),
        annualLeaveDays = numval('f_leavedays'),
        phone = val('f_phone'), email = val('f_email'), start = val('f_start'), status = val('f_status'),
        nationality = val('f_nationality'), employeeNumber = val('f_empnum'), birthDate = val('f_birth'), nationalId = val('f_nid');
  if(!name){ toast(t('toastNeedName')); return; }
  if(!email){ toast(t('toastNeedEmail')); return; }
  let accountStepMessage = null;
  let accountCreatedOk = false;

  const fields = employeeToDbFields({name,role,department,salary,allowances,annualLeaveDays:annualLeaveDays||30,phone,email,start,status,nationality,employeeNumber,birthDate,nationalId});
  let employeeId = id;
  if(id){
    const { error } = await sb.from('employees').update(fields).eq('id', id);
    if(error){ toast(t('errGeneric')); return; }
  } else {
    const { data, error } = await sb.from('employees').insert(fields).select().single();
    if(error){ toast(t('errGeneric')); return; }
    employeeId = data.id;
  }

  // Tab 2: account & permissions (admin only)
  const roleSelectEl = document.getElementById('f_acc_role');
  if(currentUser.role==='admin' && roleSelectEl){
    const accRole = roleSelectEl.value;
    const permCheckboxes = document.querySelectorAll('#staffAccountPerms input[type=checkbox]');
    const bySec = {};
    permCheckboxes.forEach(cb=>{
      const sec = cb.dataset.sec, kind = cb.dataset.kind;
      bySec[sec] = bySec[sec] || {view:false, edit:false, admin:false};
      bySec[sec][kind] = cb.checked;
    });

    if(staffModalAccount){
      // existing linked account: update role + permissions
      await sb.from('profiles').update({role:accRole}).eq('id', staffModalAccount.userId);
      for(const sec of Object.keys(bySec)){
        await sb.from('permissions').upsert({user_id:staffModalAccount.userId, section:sec, can_view:bySec[sec].view, can_edit:bySec[sec].edit, can_admin:bySec[sec].admin});
      }
      const newPasswordEl = document.getElementById('f_acc_new_password');
      const newPassword = newPasswordEl ? newPasswordEl.value : '';
      if(newPassword){
        if(newPassword.length < 6){
          accountStepMessage = t('toastPasswordTooShort');
        } else {
          const { error: resetErr } = await sb.functions.invoke('create-employee-account', { body: { action:'reset_password', user_id: staffModalAccount.userId, password: newPassword } });
          if(resetErr){
            let detail = '';
            try{ const body = await resetErr.context.json(); detail = body && body.error ? body.error : ''; }catch(_e){}
            console.error('reset_password error:', resetErr, detail);
            accountStepMessage = detail ? t('toastAccountCreateFailed',{msg:detail}) : t('toastFunctionMissing');
          } else {
            accountStepMessage = t('toastPasswordChanged');
          }
        }
      }
    } else {
      // no account yet: create one if a password was provided
      const passwordEl = document.getElementById('f_acc_password');
      const password = passwordEl ? passwordEl.value : '';
      if(password){
        if(password.length < 6){
          accountStepMessage = t('toastPasswordTooShort');
        } else {
          const { data: created, error: fnErr } = await sb.functions.invoke('create-employee-account', { body: { email, password, full_name: name } });
          if(fnErr){
            let detail = '';
            try{ const body = await fnErr.context.json(); detail = body && body.error ? body.error : ''; }catch(_e){}
            console.error('create-employee-account error:', fnErr, detail);
            if(detail && /already/i.test(detail)){
              // this email already has an auth account — find it and link it to this employee instead
              const { data: rpcUsers, error: rpcErr } = await sb.rpc('list_auth_users');
              const existing = !rpcErr && (rpcUsers||[]).find(u => u.email && u.email.toLowerCase()===email.toLowerCase());
              if(existing){
                const { data: existingProfile } = await sb.from('profiles').select('employee_id').eq('id', existing.id).maybeSingle();
                if(existingProfile && existingProfile.employee_id && existingProfile.employee_id !== employeeId){
                  accountStepMessage = t('toastEmailAlreadyLinkedElsewhere');
                } else {
                  await sb.from('profiles').update({role:accRole, employee_id:employeeId}).eq('id', existing.id);
                  for(const sec of Object.keys(bySec)){
                    await sb.from('permissions').upsert({user_id:existing.id, section:sec, can_view:bySec[sec].view, can_edit:bySec[sec].edit, can_admin:bySec[sec].admin});
                  }
                  accountStepMessage = t('toastAccountLinkedExisting');
                }
              } else {
                accountStepMessage = t('toastAccountCreateFailed',{msg:detail});
              }
            } else {
              accountStepMessage = detail ? t('toastAccountCreateFailed',{msg:detail}) : t('toastFunctionMissing');
            }
          } else if(created && created.error){
            console.error('create-employee-account returned error:', created.error);
            accountStepMessage = t('toastAccountCreateFailed',{msg:created.error});
          } else if(created && created.id){
            await sb.from('profiles').update({role:accRole, employee_id:employeeId}).eq('id', created.id);
            for(const sec of Object.keys(bySec)){
              await sb.from('permissions').upsert({user_id:created.id, section:sec, can_view:bySec[sec].view, can_edit:bySec[sec].edit, can_admin:bySec[sec].admin});
            }
            accountCreatedOk = true;
          }
        }
      }
    }
  }

  if(accountStepMessage){
    toast(accountStepMessage);
  } else if(accountCreatedOk){
    toast(t('toastAccountCreated'));
  } else {
    toast(id ? t('toastStaffUpdated') : t('toastStaffAdded'));
  }
  await reloadEmployees();
  closeModal(); render();
}

  const { error } = await sb.from('products').update({qty:newQty}).eq('id', id);
  if(error){ toast(t('errGeneric')); await reloadProducts(); render(); }
}

function txDisplayNumber(txId){
  const sorted = [...state.transactions].sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
  const idx = sorted.findIndex(t=>t.id===txId);
  return (idx+1).toString().padStart(5,'0');
}
function openTxDetailModal(id){
  const txn = state.transactions.find(t=>t.id===id);
  if(!txn) return;
  const num = txDisplayNumber(id);
  const dt = new Date(txn.createdAt);
  const dateTimeStr = dt.toLocaleDateString(state.lang==='ar'?'ar-SA-u-nu-latn':'en-US',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' — ' + dt.toLocaleTimeString(state.lang==='ar'?'ar-SA-u-nu-latn':'en-US',{hour:'2-digit',minute:'2-digit'});

  let actionsHtml = '';
  if(txn.status==='open'){
    if(canEdit('finance')){
      actionsHtml += `
        <div class="record-list-title" style="margin-top:6px;">${t('closeEntryModalTitle')}</div>
        <div class="field">
          <label>${t('resolutionTypeLabel')}</label>
          <select id="f_close_type">
            <option value="paid">${t('resolutionPaid')}</option>
            <option value="disbursed">${t('resolutionDisbursed')}</option>
          </select>
        </div>
        <div class="field"><label>${t('lblReason')}</label><input id="f_close_reason" placeholder="${t('phReasonClose')}"></div>
        <button class="btn btn-brass" style="width:100%; justify-content:center;" onclick="closeTxEntry('${id}')">${ICONS.check} ${t('closeEntryBtn')}</button>
      `;
    }
    if(currentUser.role==='admin' || canAdmin('finance')){
      actionsHtml += `
        <div class="record-list-title" style="margin-top:18px;">${t('cancelEntryModalTitle')}</div>
        <div class="field"><label>${t('lblReason')}</label><input id="f_cancel_reason" placeholder="${t('phReasonCancel')}"></div>
        <button class="btn btn-danger-ghost" style="width:100%; justify-content:center; padding:11px;" onclick="cancelTxEntry('${id}')">${ICONS.x} ${t('cancelEntryBtn')}</button>
      `;
    }
  }

  openModal(t('txDetailTitle'), `
    <div class="info-grid">
      <div class="info-box"><div><div class="info-label">${t('txNumberLabel')}</div><div class="info-value">#${num}</div></div>${ICONS.idcard}</div>
      <div class="info-box"><div><div class="info-label">${t('txStatusLabel')}</div><div class="info-value">${txStatusBadgeHtml(txn.status)}</div></div>${ICONS.check}</div>
      <div class="info-box"><div><div class="info-label">${t('txDateTimeLabel')}</div><div class="info-value">${dateTimeStr}</div></div>${ICONS.calendar}</div>
      <div class="info-box"><div><div class="info-label">${t('thCategory')}</div><div class="info-value">${catLabel(txn.category)}</div></div>${ICONS.coin}</div>
      <div class="info-box"><div><div class="info-label">${t('thAmount')}</div><div class="info-value">${money(txn.amount)}</div></div>${ICONS.cash}</div>
      <div class="info-box"><div><div class="info-label">${t('thType')}</div><div class="info-value">${txn.type==='income'?t('badgeIncome'):t('badgeExpense')}</div></div>${ICONS.trend}</div>
    </div>
    <div class="field"><label>${t('txReasonLabel')}</label><div class="banner ${txn.status==='cancelled'?'banner-amber':'banner-green'}" style="margin-bottom:0;">${txn.reason || txn.note || t('txReasonEmpty')}</div></div>
    ${actionsHtml}
  `, `
    <button class="btn btn-outline" onclick="closeModal()">${t('cancelBtn')}</button>
    ${currentUser.role==='admin' ? `<button class="btn-danger-ghost" onclick="closeModal(); deleteTx('${id}');">${ICONS.trash}</button>` : ''}
  `);
}


/* ---- order modal ---- */
let orderDraft = [];
function openOrderModal(){
  orderDraft = [{productId: state.products[0]?.id||'', qty:1}];
  openModal(t('orderModalTitle'), `
    <div class="field"><label>${t('lblCustomer')}</label><input id="f_customer" placeholder="${t('phCustomer')}"></div>
    <div class="field"><label>${t('lblItems')}</label>
      <div class="line-items" id="lineItems"></div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="addLineItem()">${ICONS.plus} ${t('addLineBtn')}</button>
    </div>
    <div class="line-total" id="orderTotal"></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">${t('cancelBtn')}</button>
    <button class="btn btn-brass" onclick="saveOrder()">${ICONS.check} ${t('createOrderBtn')}</button>
  `);
  renderLineItems();
}
function productOptions(selectedId){
  return state.products.map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${tx(p.name)} (${p.qty} ${t('inStockSuffix')})</option>`).join('');
}
function renderLineItems(){
  const el = document.getElementById('lineItems');
  if(!el) return;
  el.innerHTML = orderDraft.map((li,i)=>`
    <div class="line-item-row">
      <select onchange="orderDraft[${i}].productId=this.value; renderLineItems();">${productOptions(li.productId)}</select>
      <input type="number" min="1" value="${li.qty}" onchange="orderDraft[${i}].qty=parseInt(this.value)||1; renderLineItems();">
      <button class="btn-danger-ghost" onclick="removeLineItem(${i})">${ICONS.trash}</button>
    </div>`).join('');
  const total = orderDraft.reduce((s,li)=>{ const p=state.products.find(x=>x.id===li.productId); return s+(p?p.price*li.qty:0); },0);
  const totalEl = document.getElementById('orderTotal');
  if(totalEl) totalEl.textContent = t('totalPrefix') + total.toLocaleString('en-US') + ' ' + t('currency');
}
function addLineItem(){ orderDraft.push({productId: state.products[0]?.id||'', qty:1}); renderLineItems(); }
function removeLineItem(i){ orderDraft.splice(i,1); renderLineItems(); }
async function saveOrder(){
  if(state.products.length===0){ toast(t('toastAddInventoryFirst')); return; }
  const customerInput = val('f_customer');
  const customer = customerInput || t('walkInCustomer');
  const items = []; let total=0, cogs=0;
  for(const li of orderDraft){
    const p = state.products.find(x=>x.id===li.productId);
    if(!p || li.qty<=0) continue;
    if(li.qty > p.qty){ toast(t('toastQtyExceeds',{name:tx(p.name)})); return; }
    items.push({productId:p.id, name:tx(p.name), qty:li.qty, price:p.price, cost:p.cost});
    total += p.price*li.qty; cogs += p.cost*li.qty;
  }
  if(items.length===0){ toast(t('toastAddOneItem')); return; }

  const { data: orderRow, error: orderErr } = await sb.from('orders').insert({customer, total, status:'completed'}).select().single();
  if(orderErr){ toast(t('errGeneric')); return; }

  const itemRows = items.map(it=>({order_id:orderRow.id, product_id:it.productId, name_snapshot:it.name, qty:it.qty, price:it.price}));
  const { error: itemsErr } = await sb.from('order_items').insert(itemRows);
  if(itemsErr){ toast(t('errGeneric')); return; }

  for(const it of items){
    const p = state.products.find(x=>x.id===it.productId);
    await sb.from('products').update({qty: Math.max(0, p.qty - it.qty)}).eq('id', it.productId);
  }

  const date = new Date().toISOString().slice(0,10);
  await sb.from('transactions').insert({type:'expense', category:'cogs', amount:cogs, date, note:t('orderCogsNote'), status:'closed', resolution_type:'paid', reason:t('autoClosedCogsReason'), resolved_at:new Date().toISOString()});

  toast(t('toastOrderCreated'));
  await Promise.all([reloadOrders(), reloadProducts(), reloadTransactions()]);
  closeModal(); render();
}


/* ============================ EXPORT ============================ */
function exportSummary(){
  const tt = totals();
  const lines = [
    t('exportTitle'),
    t('exportDate')+': ' + fmtDate(new Date()),
    '-------------------------------------',
    t('exportOrders')+': ' + tt.orderCount,
    t('exportRevenue')+': ' + money(tt.revenue),
    t('exportCost')+': ' + money(tt.cost),
    t('exportProfit')+': ' + money(tt.profit),
    t('exportMargin')+': ' + pct(tt.margin),
    t('exportStaff')+': ' + state.employees.length,
    t('exportItems')+': ' + state.products.length,
  ];
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = t('exportFile');
  document.body.appendChild(a); a.click(); a.remove();
  toast(t('toastExported'));
}

/* ============================ UTIL ============================ */
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function numval(id){ const el=document.getElementById(id); return el?(parseFloat(el.value)||0):0; }

/* ============================ AUTH ============================ */
function showLogin(){
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function showApp(){
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
}
function showLoading(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';
}
function loginErrorShow(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg; el.classList.add('show');
}
function loginErrorHide(){
  document.getElementById('loginError').classList.remove('show');
}
async function handleLogin(){
  loginErrorHide();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){ loginErrorShow(t('loginErrorEmpty')); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> '+t('loginBtnLoading');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = t('loginBtn');
  if(error){ loginErrorShow(t('loginErrorGeneric')); return; }
  await bootstrapSession(data.session);
}
async function handleLogout(){
  await sb.auth.signOut();
  if(__realtimeChannel){ sb.removeChannel(__realtimeChannel); __realtimeChannel = null; }
  currentUser.id = null; currentUser.email = null; currentUser.role = null; currentUser.employeeId = null; currentUser.permissions = {};
  state.employees = []; state.products = []; state.transactions = []; state.orders = [];
  showLogin();
}

async function bootstrapSession(session){
  if(!session){ showLogin(); return; }
  showLoading();
  currentUser.id = session.user.id;
  currentUser.email = session.user.email;

  const { data: profile, error: profErr } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if(profErr || !profile){ console.error(profErr); showLogin(); return; }
  currentUser.role = profile.role;
  currentUser.employeeId = profile.employee_id;

  if(currentUser.role !== 'admin'){
    const { data: perms } = await sb.from('permissions').select('*').eq('user_id', currentUser.id);
    const map = {};
    (perms||[]).forEach(p=>{ map[p.section] = {view:p.can_view, edit:p.can_edit, admin:p.can_admin}; });
    currentUser.permissions = map;
  }

  if(currentUser.role === 'employee'){
    await reloadMyEmployee();
  } else {
    await reloadAllData();
    setupRealtime();
    // land on the first section this account can actually view
    if(!canView(state.page)) state.page = SECTIONS.find(s=>canView(s)) || 'overview';
  }

  renderStaticText();
  renderNav();
  render();
  showApp();
}

/* ============================ INIT ============================ */
document.getElementById('loginBrandName').textContent = t('brandName');
document.getElementById('loginBrandSub').textContent = t('loginTitle');
document.getElementById('loginEmailLabel').textContent = t('loginEmailLabel');
document.getElementById('loginPasswordLabel').textContent = t('loginPasswordLabel');
document.getElementById('loginBtn').textContent = t('loginBtn');
document.getElementById('loginHint').textContent = t('loginHint');
document.getElementById('loadingScreen').lastElementChild.textContent = t('loadingText');

showLoading();
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'SIGNED_OUT'){ showLogin(); }
});
sb.auth.getSession().then(({data})=>{ bootstrapSession(data.session); });

let __resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(render, 200);
});
</script>
